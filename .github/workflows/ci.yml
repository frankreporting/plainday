# Runs on every pull request, and on main after a merge. What each job checks is documented in
# CLAUDE.md ("Working on the system") and at the top of the scripts in .github/ci/.
name: CI

on:
  pull_request:
    # `edited` re-runs the PR checks when the title or body is fixed
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install zsh (the calendar sync script runs under it)
        run: command -v zsh >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q zsh)
      - name: Vault tests and CI-check tests
        run: node --test "Config/Scripts/tests/*.test.mjs" .github/ci/*.test.mjs

  scripts:
    name: Scripts load, settings parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/ci/checkScripts.mjs
      - name: No numbered folders (OBS-81)
        run: node .github/ci/checkFolders.mjs

  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history, so the release dry run can read main's version at the PR's base
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Plainday (main.js)
        run: npm run build
      - name: Bundle tests
        run: npm test
      # Obsidian's lint (OBS-230; CLAUDE.md, "Lint"). The summary never fails: it puts the
      # warnings' count by rule on the job's page. The lint fails on an error the baseline
      # (.github/ci/eslint-suppressions.json) doesn't let through, on a baseline entry whose
      # error is fixed, and on any warning in Plainday's own code. ESLint reads the baseline only
      # where a command names it (OBS-268), so the summary names it too.
      - name: Obsidian lint summary
        run: |
          npx eslint . --suppressions-location .github/ci/eslint-suppressions.json --format json --output-file "$RUNNER_TEMP/lint.json" || true
          node .github/ci/lintSummary.mjs "$RUNNER_TEMP/lint.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Obsidian lint
        run: npm run lint
      # What merging would release (CLAUDE.md, "Releases"): the same script and files as
      # .github/workflows/release.yml, kept for a week to download. Merging publishes only when
      # the PR raises the version past main's (OBS-266).
      - name: Release dry run
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/ci/release.mjs dry-run --out "$RUNNER_TEMP/release"
      - name: Keep the release's files
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: plainday-release
          path: ${{ runner.temp }}/release/
          retention-days: 7
          if-no-files-found: error

  privacy:
    name: Privacy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan the diff, commits, title, body and branch name
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node .github/ci/privacy.mjs

  pr:
    name: Linear link and docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the PR body and branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node .github/ci/checkPR.mjs
      - name: Plainday's version files agree, and the version doesn't go down
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/ci/checkVersion.mjs
      - name: The lint baseline doesn't grow, and isn't at the root
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/ci/checkBaseline.mjs
