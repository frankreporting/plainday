# Publishes a release of Plainday when main's version doesn't have one yet (OBS-230). So to
# release, a PR raises the version, and merging it publishes the release. CLAUDE.md
# ("Releases") has the steps; .github/ci/release.mjs does the work, the same script as the PR's
# dry run in ci.yml.
name: Release

on:
  push:
    branches: [main]
  # Run again by hand: it publishes only a version that has no release yet
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and a run that started is never cancelled
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Only from main, even when run by hand on another branch
    if: github.ref == 'refs/heads/main'
    # The only job in this repository that may write to it: to tag and publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # A fresh checkout of the merge commit, built the way the community directory rebuilds
      # it to compare with the release's main.js
      - run: npm ci
      - name: Build Plainday (main.js)
        run: npm run build
      - name: Publish, unless this version is released already
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/ci/release.mjs publish --out "$RUNNER_TEMP/release"
